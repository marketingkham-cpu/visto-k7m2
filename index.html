<style>
/* Layout: app de una columna (máx 480px). Encabezado de papel azul a todo lo ancho, cuerpo sobre papel blanco, 4 pestañas fijas abajo. Branding Merkha "Redes sep 2026" */
:root{
  --peri:#8FA7D2; --peri-ink:#5E76B3; --peri-soft:#7D93C6; --peri-wash:#E9EEF7;
  --butter:#EEE5A4; --butter-dark:#C9B75A; --blush:#F4E4DC; --night:#1F2F3C;
  --paper:#F7F8FA; --card:#FFFFFF; --ink:#1F2F3C; --muted:#5D6B7A; --line:#DCE3EF;
  --ok:#2F7A52; --ok-bg:#E1F0E7; --warn-bg:#FBF3D8; --falta:#B4472F;
  --tex-body:url("tex/papel-blanco.jpg"); --tex-head:url("tex/papel-azul.jpg");
  --display:"Bodoni Moda", Georgia, "Times New Roman", serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1F2F3C;--card:#263849;--ink:#F1F3F7;--muted:#AEBACB;--line:#36495C;--peri-ink:#A9BBE0;--peri-wash:#2C405A;--blush:#3A3A40;--ok:#8FCBA6;--ok-bg:#1F3629;--warn-bg:#3A3424;--falta:#F0A08C;--tex-body:none;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1F2F3C;--card:#263849;--ink:#F1F3F7;--muted:#AEBACB;--line:#36495C;--peri-ink:#A9BBE0;--peri-wash:#2C405A;--blush:#3A3A40;--ok:#8FCBA6;--ok-bg:#1F3629;--warn-bg:#3A3424;--falta:#F0A08C;--tex-body:none;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper) var(--tex-body) center top/600px auto repeat;color:var(--ink);font-family:var(--body);font-weight:400;font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(20px + env(safe-area-inset-top,0px)) 20px 22px;background:var(--peri) var(--tex-head) center/cover;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;overflow:hidden}
@media (min-width:513px){header.top{margin-inline:0;border-radius:0 0 22px 22px}}
.brand{display:flex;flex-direction:column;gap:4px;line-height:1;position:relative;z-index:1}
.brand .eyebrow{color:rgba(255,255,255,.9)}
.brand .name{font-weight:800;font-size:34px;letter-spacing:-.02em}
.who{font-size:13px;font-weight:300;text-align:right;line-height:1.3;min-width:0;position:relative;z-index:1}
.who b{display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{position:absolute;fill:var(--butter);pointer-events:none}
.star.s1{width:28px;top:calc(14px + env(safe-area-inset-top,0px));left:150px;transform:rotate(-8deg)}
.star.s2{width:15px;top:calc(46px + env(safe-area-inset-top,0px));left:184px;transform:rotate(14deg)}
.eyebrow,.label,.step{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--peri-ink)}
.demo{background:var(--butter);color:var(--night);border-radius:14px;padding:13px 15px;font-size:14px;font-weight:300;display:flex;flex-direction:column;gap:8px}
.demo b{font-weight:700}
.demo .row{display:flex;gap:8px;flex-wrap:wrap}
#btnEmpezar{background:var(--night);border-color:var(--night);color:#fff}
h1{font-size:30px;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:19px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;font-weight:300;margin:0}
section{display:flex;flex-direction:column;gap:10px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:#1F2F3C;color:#fff;border-radius:14px;padding:12px 8px;text-align:center}
.summary b{display:block;font-size:32px;font-weight:800;line-height:1.1;color:#EEE5A4;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;font-weight:300;line-height:1.2;display:block;color:#DCE3EF}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:11px;min-width:0;box-shadow:0 2px 0 var(--line)}
.card.due{border-top:5px solid var(--peri)}
.card.late{border-top-color:var(--butter-dark)}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cname{font-weight:800;font-size:20px;letter-spacing:-.01em}
.cped{color:var(--muted);font-size:14px;font-weight:300}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--peri-wash);color:var(--peri-ink)}
.pill.late{background:#EEE5A4;color:#1F2F3C}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.cold{background:var(--blush);color:var(--muted)}
textarea,input,select{font:inherit;font-size:15px;font-weight:400;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink)}
textarea{resize:vertical;min-height:130px;line-height:1.45}
.win{border:1px solid var(--line);border-bottom:1px dashed var(--line);border-radius:12px 12px 0 0;background:var(--card);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--peri-ink)}
.win + textarea{margin-top:-11px;border-top:0;border-radius:0 0 12px 12px}
.dots{display:flex;gap:4px;flex:none}.dots i{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--butter-dark)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn.wa{background:#5E76B3;border-color:#5E76B3;color:#fff;flex:1;justify-content:center;font-size:15px;font-weight:700;padding:12px 14px}
button.main{background:#1F2F3C;border-color:#1F2F3C;color:#fff}
:root[data-theme="dark"] button.main{background:#EEE5A4;border-color:#EEE5A4;color:#1F2F3C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.main{background:#EEE5A4;border-color:#EEE5A4;color:#1F2F3C}}
button.small{font-size:13px;padding:7px 12px;font-weight:500}
button:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--peri-ink);outline-offset:2px}
.after{border-top:1px dashed var(--line);padding-top:11px;display:flex;flex-direction:column;gap:8px}
.after p{margin:0;font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:8px}
.row-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row-top b{font-weight:700}
.empty{background:var(--card);border:1px dashed var(--peri);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:14px;font-weight:300}
.empty b{font-weight:700;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;position:relative}
.chip[aria-pressed="true"]{background:#7D93C6;border-color:#7D93C6;color:#fff;font-weight:700;border-radius:3px}
.chip[aria-pressed="true"]::before,.chip[aria-pressed="true"]::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;border:1.5px solid #7D93C6}
.chip[aria-pressed="true"]::before{top:-4px;left:-4px}.chip[aria-pressed="true"]::after{bottom:-4px;right:-4px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px 12px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.msg::before{content:"";display:block;height:28px;margin:0 -14px 10px;border-bottom:1px dashed var(--line);background:radial-gradient(circle at calc(100% - 44px) 50%,transparent 3px,var(--butter-dark) 3.3px 4.7px,transparent 5px),radial-gradient(circle at calc(100% - 31px) 50%,transparent 3px,var(--butter-dark) 3.3px 4.7px,transparent 5px),radial-gradient(circle at calc(100% - 18px) 50%,transparent 3px,var(--butter-dark) 3.3px 4.7px,transparent 5px)}
.fill{background:#EEE5A4;color:#1F2F3C;border-radius:4px;padding:0 3px;font-style:italic}
.tip{font-size:13.5px;color:var(--muted);font-weight:300}
.tip b{color:var(--ink);font-weight:700}
.reco{background:var(--blush);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:14px;font-weight:300}
.reco b{display:block;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--peri-ink);margin-bottom:3px}
.todo{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:13.5px}
.todo ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-weight:300}
.falta{color:var(--falta);font-weight:700}
.atajo{font-weight:800;color:var(--peri-ink);font-variant-numeric:tabular-nums}
.meta{font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:700}
details ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:300}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:14px;font-weight:700}
.field small{font-size:12.5px;color:var(--muted);font-weight:300}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:500;font-size:14px;cursor:pointer}
.radios input{width:auto;accent-color:var(--peri-ink)}
.firma{font-size:13px;font-weight:300;color:var(--muted);text-align:center;padding-block:10px;line-height:1.6}
.firma .logo{display:block;font-size:22px;font-weight:500;letter-spacing:-.035em;color:var(--peri-ink);margin-bottom:2px}
.firma .logo i{font-family:var(--display);font-weight:600}
.firma a{color:var(--peri-ink);font-weight:600}
.firma .ig{display:block;font-weight:600;color:var(--peri-ink);margin-top:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:12px;flex-direction:column;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--muted);justify-content:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:#fff;background:#7D93C6}
.badge{background:#EEE5A4;color:#1F2F3C;border-radius:999px;font-size:11px;font-weight:800;padding:0 6px;margin-left:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#1F2F3C;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(440px,calc(100vw - 32px));z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
.demo .seeds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.demo .seeds span{font-size:12.5px;font-weight:600;margin-right:2px}
.demo .seeds button{background:rgba(255,255,255,.55);border-color:transparent;color:#1F2F3C;padding:5px 11px}
.demo .seeds button[aria-pressed="true"]{background:#fff;font-weight:700;box-shadow:inset 0 0 0 1.5px #1F2F3C}
.radios.giros{flex-direction:column}
.radios.giros label{border-radius:12px;align-items:flex-start;padding:9px 12px}
.radios.giros input{margin-top:4px}
.radios.giros small{display:block;font-size:12.5px;font-weight:300;color:var(--muted)}
#respaldo,#instalar{scroll-margin-top:16px}
#instalar ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:300}
</style>
</head>

function nextDate(c){return addDays(c.last,GAPS[Math.min(c.segs,2)])}
function pend(){return S.clientes.filter(function(c){return c.estado==='pend'})}
function dueList(){var t=today();return pend().filter(function(c){return nextDate(c)<=t}).sort(function(a,b){return b.segs-a.segs})}
function cuando(c){
  var d=diff(today(),nextDate(c));
  if(d<0)return {txt:'Atrasado '+(-d)+(d===-1?' día':' días'),cls:'late'};
  if(d===0)return {txt:'Le toca hoy',cls:''};
  if(d===1)return {txt:'Le toca mañana',cls:'cold'};
  return {txt:'Le toca el '+DIAS[parse(nextDate(c)).getDay()],cls:'cold'};
}
function hace(s){var d=diff(s,today());return d===0?'hoy':d===1?'ayer':'hace '+d+' días'}
function waLink(tel,txt){
  var n=(tel||'').replace(/\D/g,'');
  if(n.length===10)n='52'+n;
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(txt);
}

function leerRespaldo(txt){

    (S.respaldo?'<div class="meta">Último respaldo: <b>'+hace(S.respaldo)+'</b></div>':'')+
    '<div class="btns"><button type="button" class="main" id="btnDescargar">Descargar respaldo</button><button type="button" id="btnCopiarResp">Copiar respaldo</button></div>'+
    '<div class="tip">El más fácil: toca <b>Copiar respaldo</b> y pégalo en tu chat contigo en WhatsApp (búscate en tus contactos, sale como "Tú"). Ahí se queda guardado.</div>'+
    '<details><summary>Recuperar un respaldo</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">'+
      '<div class="field"><label for="rTxt">Pega aquí el texto del respaldo</label><textarea id="rTxt" style="min-height:90px" placeholder="Empieza con {&quot;app&quot;:&quot;VISTO&quot;..."></textarea></div>'+
      '<div class="field"><label for="rFile">O elige el archivo que descargaste</label><input type="file" id="rFile" accept=".txt,.json,text/plain,application/json"></div>'+
      '<div id="rInfo"></div></div></details></section>';
  h+='<div class="btns"><button type="button" class="small" id="btnEjemplo">Volver a cargar el ejemplo</button></div>';
  return h;
}
function infoRestaurar(o){
  var el=document.getElementById('rInfo');if(!el)return;
  if(!o){el.innerHTML='<div class="tip"><span class="falta">Ese texto no es un respaldo de VISTO.</span> Revisa que lo hayas copiado completo.</div>';restaurando=null;return}
  restaurando=o;
  var fd=/^\d{4}-\d{2}-\d{2}$/.test(o.fecha)?parse(o.fecha):null;
  el.innerHTML='<div class="todo">Respaldo del <b>'+(fd?fd.getDate()+' de '+MESES[fd.getMonth()]:esc(o.fecha))+'</b> de <b>'+esc(o.datos.ficha.negocio||'tu negocio')+'</b> con '+o.datos.clientes.length+' clientes. Lo que tienes ahorita en la app se reemplaza.</div><div class="btns" style="margin-top:8px"><button type="button" class="main" id="btnRestaurar">Recuperar este respaldo</button></div>';
}

/* ---------- Render ---------- */
function render(){
  var t=S.tab;
  view.innerHTML='<div style="display:flex;flex-direction:column;gap:16px;padding-top:16px">'+(t==='hoy'?vHoy():t==='clientes'?vClientes():t==='respuestas'?vRespuestas():vFicha())+'</div>';
  document.querySelectorAll('nav.tabs button').forEach(function(b){b.setAttribute('aria-current',b.dataset.tab===t?'page':'false')});
  var n=dueList().length, bd=document.getElementById('badgeHoy');bd.hidden=!n;bd.textContent=n;
  document.getElementById('hdrNeg').textContent=(S.ficha.negocio||'Tu negocio');
  var d=new Date();document.getElementById('hdrFecha').textContent=cap(DIAS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()];
  var demo=document.getElementById('demo');demo.hidden=!S.ejemplo;
  if(S.ejemplo){
    document.getElementById('demoTxt').innerHTML='<b>Estás viendo un ejemplo.</b> Así lo vería '+esc(S.ficha.yo)+', de '+esc(S.ficha.negocio)+'. Toca los botones como si fuera tu negocio. Lo que está en <span class="fill">amarillo</span> es lo que el dueño cambia antes de mandar.';
    document.querySelectorAll('#demo [data-seed]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.seed===G())});
  }
  var fa=document.getElementById('aNom');if(fa)fa.focus();
}
function toast(msg){
  var o=document.querySelector('.toast');if(o)o.remove();
  var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);
  setTimeout(function(){el.remove()},3400);
}
function byId(id){return S.clientes.filter(function(c){return c.id===+id})[0]}
function copyFrom(id,btn){
  var el=document.getElementById(id), txt=el.tagName==='TEXTAREA'?el.value:el.textContent, lbl=btn.textContent;
  function ok(){btn.textContent=huecos(txt).length?'Copiado, cambia lo amarillo':'Copiado';setTimeout(function(){btn.textContent=lbl},1800)}
  function fail(){
    if(el.tagName==='TEXTAREA'){el.select();btn.textContent='Selecciona y copia'}
    else{var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selecciona y copia'}
  }
  try{navigator.clipboard.writeText(txt).then(ok,fail)}catch(e){fail()}
}
function marcarRespaldo(){S.respaldo=today();save()}

document.querySelector('nav.tabs').addEventListener('click',function(e){
  var b=e.target.closest('button[data-tab]');if(!b)return;S.tab=b.dataset.tab;openAdd=false;save();render();scrollTo(0,0);
});
var empezarArmado=false;
document.getElementById('btnEmpezar').addEventListener('click',function(){
  if(!empezarArmado){empezarArmado=true;this.textContent='Sí, borrar el ejemplo y empezar';return}
  empezarArmado=false;this.textContent='Empezar con mi negocio';S=blank(G());save();render();toast('Listo. Empieza llenando tu ficha.');
});
document.getElementById('demo').addEventListener('click',function(e){
  var b=e.target.closest('[data-seed]');if(!b)return;
  var keep=S.tab;S=seed(b.dataset.seed);S.tab=keep;sit=null;openAdd=false;save();render();
  toast('Ejemplo: '+S.ficha.negocio+'.');
});

view.addEventListener('click',function(e){
  var t=e.target;
  var cp=t.closest('[data-copy]');if(cp){copyFrom(cp.dataset.copy,cp);return}
  var ch=t.closest('[data-sit]');if(ch){sit=sit===ch.dataset.sit?null:ch.dataset.sit;render();return}
  if(t.id==='btnAdd'){openAdd=true;render();return}
  if(t.id==='btnCancel'){openAdd=false;render();return}
  if(t.id==='btnEjemplo'){var keep=S.tab;S=seed(G());S.tab=keep;save();render();toast('Se cargó otra vez el ejemplo.');return}
  if(t.id==='btnIrInstalar'){S.tab='ficha';save();render();var i0=document.getElementById('instalar');if(i0)i0.scrollIntoView({block:'start'});return}
  if(t.id==='btnOcultarInstalar'){S.sinAvisoInstalar=true;save();render();return}
  if(t.id==='btnInstalar'&&promptInstalar){promptInstalar.prompt();promptInstalar.userChoice.then(function(){promptInstalar=null;render()});return}
  if(t.id==='btnIrRespaldo'){S.tab='ficha';save();render();var r=document.getElementById('respaldo');if(r)r.scrollIntoView({block:'start'});return}
  if(t.id==='btnDescargar'){
    try{
      var blob=new Blob([respaldoTxt()],{type:'text/plain'}),u=URL.createObjectURL(blob),a0=document.createElement('a');
      a0.href=u;a0.download='respaldo-visto-'+today()+'.txt';document.body.appendChild(a0);a0.click();a0.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
      marcarRespaldo();toast('Listo. Busca el archivo en tus Descargas.');
    }catch(err){toast('Tu celular no dejó descargar. Usa "Copiar respaldo".')}
    return;
  }
  if(t.id==='btnCopiarResp'){
    var txt=respaldoTxt();
    try{navigator.clipboard.writeText(txt).then(function(){marcarRespaldo();toast('Copiado. Pégalo en tu chat contigo en WhatsApp.')},function(){toast('No se pudo copiar. Usa "Descargar respaldo".')})}catch(err){toast('No se pudo copiar. Usa "Descargar respaldo".')}
    return;
  }
  if(t.id==='btnRestaurar'&&restaurando){
    S=restaurando.datos;S.ejemplo=false;S.tab='hoy';if(!S.ficha.giro)S.ficha.giro='producto';restaurando=null;save();render();scrollTo(0,0);toast('Respaldo recuperado.');return;
  }
  var wa=t.closest('[data-wa]');
  if(wa){
    var ta=document.getElementById('m-'+wa.dataset.wa), c0=byId(wa.dataset.wa);
    if(ta&&c0){wa.href=waLink(c0.tel,ta.value);if(huecos(ta.value).length)toast('Ojo: todavía hay partes en [ ] sin cambiar. Puedes editarlas en WhatsApp antes de enviar.')}
    return;
  }
  var a=t.closest('[data-act]');if(!a)return;
  var c=byId(a.dataset.id);if(!c)return;
  var act=a.dataset.act;
  if(act==='enviado'){
    c.segs++;c.last=today();
    if(c.segs>=3){c.estado='enfrio';toast('Era el último mensaje. '+c.nombre+' pasó a "Se enfrió". Si te contesta, lo regresas desde Clientes.')}
    else toast('Anotado. Si no contesta, la app te avisa el '+DIAS[parse(nextDate(c)).getDay()]+'.');
  }else if(act==='contesto'){
    c.segs=0;c.last=today();toast('Contéstale. Si se vuelve a quedar callado, mañana te avisa la app.');
  }else if(act==='compro'){
    c.estado='compro';toast('Bien. Mándale /gracias y en unos días /resena.');
  }else if(act==='revive'){
    c.estado='pend';c.segs=0;c.last=today();toast(c.nombre+' regresó a Pendientes.');
  }else if(act==='gracias'){
    var m=rapidas().filter(function(x){return x.a==='gracias'})[0].m.replace(NOM,c.nombre);
    try{navigator.clipboard.writeText(m).then(function(){toast('Copiado. Pégalo en su chat y cambia lo que está entre [ ].')},function(){toast(m)})}catch(err){toast(m)}
    return;
  }else if(act==='borrar'){
    if(a.dataset.sure!=='1'){a.dataset.sure='1';a.textContent='¿Seguro? Toca otra vez';return}
    S.clientes=S.clientes.filter(function(x){return x!==c});toast('Quitado.');
  }
  save();render();
});
view.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.f){S.ficha[t.dataset.f]=t.value;save();document.getElementById('hdrNeg').textContent=S.ficha.negocio||'Tu negocio';return}
  if(t.id==='rTxt'){if(t.value.trim())infoRestaurar(leerRespaldo(t.value));else{restaurando=null;document.getElementById('rInfo').innerHTML=''}return}
  if(t.dataset.msg){
    var c=byId(t.dataset.msg),l=view.querySelector('[data-wa="'+t.dataset.msg+'"]'),p=document.getElementById('p-'+t.dataset.msg);
    if(c&&l)l.href=waLink(c.tel,t.value);
    if(p)p.innerHTML=todoHtml(t.value);
  }
});
view.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='tipo'||t.name==='trato'||t.name==='giro'){S.ficha[t.name]=t.value;save();render()}
  if(t.id==='rFile'&&t.files&&t.files[0]){
    var rd=new FileReader();rd.onload=function(){infoRestaurar(leerRespaldo(String(rd.result)))};rd.onerror=function(){infoRestaurar(null)};rd.readAsText(t.files[0]);
  }
});
view.addEventListener('submit',function(e){
  if(e.target.id!=='fAdd')return;e.preventDefault();
  var nom=document.getElementById('aNom').value.trim(),ped=document.getElementById('aPed').value.trim();
  if(!nom||!ped)return;
  var c={id:S.nid++,nombre:nom,pedido:ped,tel:document.getElementById('aTel').value.trim(),last:addDays(today(),-(+document.getElementById('aLast').value)),segs:+document.getElementById('aSegs').value,estado:'pend'};
  S.clientes.push(c);openAdd=false;save();render();
  var w=cuando(c);toast(nom+' anotado. '+w.txt+'.');
});

render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname)){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
})();
</script>

</body>
</html>
